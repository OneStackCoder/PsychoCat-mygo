name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            name: psychocat-linux-amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            name: psychocat-linux-arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
            name: psychocat-windows-amd64.exe
          - os: macos-latest
            goos: darwin
            goarch: arm64
            name: psychocat-macos-arm64

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          ldflags="-s -w"
          if [ "$GOOS" = "windows" ]; then
            ldflags="$ldflags -H=windowsgui"
          fi
          go build -trimpath -ldflags="$ldflags" -o "dist/${{ matrix.name }}" .

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "dist/${{ matrix.name }}" --clobber
